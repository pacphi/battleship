name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '26'
  RUST_TOOLCHAIN: stable

jobs:
  check:
    name: Astro Check · Lint · Format · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run lint:md
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build

      - name: Upload dist for cog-check
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  cog-check:
    name: Cog · cargo check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cogs/battleship/target
          key: cargo-check-${{ hashFiles('cogs/battleship/Cargo.lock') }}
          restore-keys: cargo-check-

      # build.rs runs during cargo check; it skips pnpm build because dist/ is present.
      - name: cargo check (all targets including tests)
        run: cargo check --manifest-path cogs/battleship/Cargo.toml --tests
        env:
          # build.rs writes to src/assets.rs — suppress the "file already exists" noise
          # and ensure the check sees the right dist/ path from the repo root.
          CARGO_TERM_COLOR: always
